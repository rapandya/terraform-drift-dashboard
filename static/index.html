<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraform Drift Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Terraform Drift Dashboard</h1>
                <p class="text-slate-500 text-sm mt-1">Status: <span id="scan-status-text" class="font-medium text-slate-700">Ready</span></p>
            </div>
            <button id="scan-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition">
                Run Scan
            </button>
        </header>

        <!-- Environment Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div id="card-dev" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">DEV</span>
                <div id="count-dev" class="text-2xl font-extrabold text-slate-800 mt-1">0</div>
                <div id="status-dev" class="text-xs font-medium text-slate-500 mt-1">Not Scanned</div>
            </div>
            <div id="card-qa" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">QA</span>
                <div id="count-qa" class="text-2xl font-extrabold text-slate-800 mt-1">0</div>
                <div id="status-qa" class="text-xs font-medium text-slate-500 mt-1">Not Scanned</div>
            </div>
            <div id="card-perf" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">PERF</span>
                <div id="count-perf" class="text-2xl font-extrabold text-slate-800 mt-1">0</div>
                <div id="status-perf" class="text-xs font-medium text-slate-500 mt-1">Not Scanned</div>
            </div>
            <div id="card-prod" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">PROD</span>
                <div id="count-prod" class="text-2xl font-extrabold text-slate-800 mt-1">0</div>
                <div id="status-prod" class="text-xs font-medium text-slate-500 mt-1">Not Scanned</div>
            </div>
        </div>

        <!-- Controls / Filters -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-2">
                <button class="filter-btn active" data-status="all">All (<span id="count-total">0</span>)</button>
                <button class="filter-btn" data-status="in_sync">In Sync</button>
                <button class="filter-btn" data-status="drift_detected">Drift Detected</button>
                <button class="filter-btn" data-status="error">Error</button>
                <button class="filter-btn" data-status="not_scanned">Not Scanned</button>
            </div>
            <input type="text" id="table-filter" placeholder="Search role path..." class="w-full md:w-64 px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Main Results Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-3 px-4">Role Path</th>
                            <th class="py-3 px-4 text-center">DEV</th>
                            <th class="py-3 px-4 text-center">QA</th>
                            <th class="py-3 px-4 text-center">PERF</th>
                            <th class="py-3 px-4 text-center">PROD</th>
                        </tr>
                    </thead>
                    <tbody id="drift-table-body" class="divide-y divide-slate-100 text-sm">
                        <tr>
                            <td colspan="5" class="py-8 text-center text-slate-400">Loading scan results...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Log Modal Popup -->
    <div id="output-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Scan Output</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="modal-log" class="log-output"></pre>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
