[project]
name = "terraform-drift-dashboard"
version = "0.1.0"
description = "Terraform and Terragrunt drift detection dashboard"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Ravi Pandya", email = "ravipandya1229@gmail.com" }
]

dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
terraform-drift-dashboard = "terraform_drift_dashboard.main:start"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
